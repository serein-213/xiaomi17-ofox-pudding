name: Build OrangeFox Recovery

# ============================================================
# 触发方式
#   · 手动: Actions 页面点 Run workflow, 可勾选要构建的设备
#   · 推送: 改动 patches/ 或 device-tree/ 时自动构建(仅默认设备)
#   · Tag : 打 v* 标签时构建全部启用设备并创建 Release
# ============================================================
on:
  workflow_dispatch:
    inputs:
      devices:
        description: '要构建的设备(逗号分隔, 留空=devices.yml 中所有 enabled)'
        required: false
        default: ''
  push:
    branches: [master, main]
    paths: ['patches/**', 'device-tree/**', 'devices.yml', 'scripts/**', '.github/workflows/**']
  release:
    types: [published]

permissions:
  contents: write

env:
  FOX_BRANCH: twrp-16
  MANIFEST: https://github.com/OrangeFox16/platform_manifest_twrp_aosp.git
  SRC_ROOT: ${{ github.workspace }}/fox_16.0

jobs:
  # ---------- 读取 devices.yml, 生成构建矩阵 ----------
  config:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: gen
        env:
          REQUESTED: ${{ github.event.inputs.devices }}
        run: |
          python3 - <<'PY' > /tmp/devices.json
          import os, json, yaml
          cfg = yaml.safe_load(open('devices.yml'))
          devs = [d for d in cfg['devices'] if d.get('enabled')]
          req = os.environ.get('REQUESTED','').strip()
          if req:
              want = {x.strip() for x in req.split(',') if x.strip()}
              devs = [d for d in cfg['devices'] if d['name'] in want]
          print(json.dumps(devs))
          PY
          echo "matrix=$(cat /tmp/devices.json)" >> "$GITHUB_OUTPUT"
          echo "将构建: $(cat /tmp/devices.json | python3 -c 'import sys,json;print(", ".join(d["name"] for d in json.load(sys.stdin)))')"

  # ---------- 构建设备 ----------
  build:
    needs: config
    if: needs.config.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 350          # 留在 GitHub 6 小时上限内
    strategy:
      fail-fast: false
      max-parallel: 2             # 同时最多 2 台, 避免 runner 排队过久
      matrix:
        device: ${{ fromJSON(needs.config.outputs.matrix) }}

    steps:
      - name: 检出本仓库(补丁与设备树改动)
        uses: actions/checkout@v4
        with:
          path: repo

      # 释放 runner 磁盘: 预装工具链对 AOSP 构建无用, 可腾出约 30GB
      - name: 清理磁盘空间
        run: |
          echo "清理前:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
                      /usr/lib/jvm /usr/share/swift "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          docker system prune -af || true
          echo "清理后:"; df -h / | tail -1

      # AOSP 16 的 soong_build 是 Go 程序, 全量分析 Android.bp 需要大量内存;
      # GitHub runner 只有 15.6GB, 实测会在生成 ninja 阶段被 OOM 杀掉, 表现为
      # "ninja: build stopped: interrupted by user." + "FAILED: out/soong/build.*.ninja"
      # (运行约 23 分钟即中断, 远未到 timeout-minutes)。
      # 加 16GB swap 让内核有溢出空间, 是 GitHub Actions 跑 Android 构建的常规做法。
      - name: 配置 swap
        run: |
          echo "内存情况:"; free -h
          SWAPFILE=/mnt/swapfile
          # 24GB: 本地构建实测峰值用了 19GB swap(30GB RAM + 31GB swap 的机器),
          # runner 只有 15.6GB RAM, 16GB swap 仍不够, 提到 24GB。
          sudo fallocate -l 24G "$SWAPFILE" || sudo dd if=/dev/zero of="$SWAPFILE" bs=1M count=24576 status=none
          sudo chmod 600 "$SWAPFILE"
          sudo mkswap "$SWAPFILE"
          sudo swapon "$SWAPFILE"
          # 默认 swappiness=60, soong_build(Go) 的匿名页压力大, 调到 100 更积极换出,
          # 避免 OOM killer 直接杀进程; vfs_cache_pressure 降低保留目录缓存,
          # 否则 AOSP 几十万个文件的 stat 会被反复换出(swap thrashing)。
          sudo sysctl -w vm.swappiness=100
          sudo sysctl -w vm.vfs_cache_pressure=50
          sudo sysctl -w vm.overcommit_memory=1
          echo "swap 就绪:"; free -h
          echo "vm 参数:"; sysctl vm.swappiness vm.vfs_cache_pressure vm.overcommit_memory
          echo "磁盘:"; df -h / | tail -1

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          # 注意: ubuntu-latest 现为 24.04, libncurses5 / lib32ncurses5-dev 已废弃移除;
          # AOSP 构建在新版 Ubuntu 上改用下列等价包.
          sudo apt-get install -y -qq git-core gnupg flex bison build-essential \
            zip unzip curl rsync libc6-dev-i386 libncurses-dev lib32z1-dev \
            x11proto-core-dev libx11-dev libgl1-mesa-dev libxml2-utils xsltproc \
            fontconfig xz-utils python3-yaml ccache imagemagick \
            lib32stdc++6 g++-multilib gcc-multilib || {
              echo "部分包失败, 尝试最小集合"; \
              sudo apt-get install -y -qq git-core gnupg flex bison build-essential \
                zip unzip curl rsync libxml2-utils xsltproc fontconfig xz-utils \
                python3-yaml ccache; }
          echo "  repo 工具版本:"; which repo || true
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: 缓存 ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          # key 里放 run_id 会导致每次都写新缓存(旧的自然过期), 无法命中;
          # 改为固定前缀 + 每 10 次运行轮换一次, 让 restore-keys 真正复用历史缓存。
          # ccache 对 CI 收益最大: soong bootstrap 之后的 C/C++ 编译可大幅命中。
          key: ccache-${{ matrix.device.name }}-${{ github.run_number }}
          restore-keys: ccache-${{ matrix.device.name }}-

      - name: 初始化源码树(浅克隆)
        # 注意: 不能设 working-directory —— 该目录由本步创建, 否则 GitHub 无法启动
        # 本步自带诊断: 任何失败都会以 ::error:: 注解上报, 便于在无法取完整日志时定位
        run: |
          set -o pipefail
          export PATH="$HOME/bin:$PATH"

          echo "===> 0/4 环境检查"
          df -h / | tail -1
          command -v git python3 curl || true

          echo "===> 1/4 准备 repo 工具"
          if ! command -v repo >/dev/null 2>&1; then
            mkdir -p "$HOME/bin"
            if ! curl -fsSL --retry 3 --retry-delay 2 \
                 https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"; then
              echo "::error::无法下载 repo 工具 (storage.googleapis.com 不可达)"
              exit 1
            fi
            chmod +x "$HOME/bin/repo"
          fi
          repo --version 2>&1 | head -2
          echo "$HOME/bin" >> "$GITHUB_PATH"

          echo "===> 2/4 预检 manifest 可达性与分支"
          echo "  manifest: $MANIFEST"
          echo "  branch  : $FOX_BRANCH"
          # 注意: git ls-remote <url> <branch> 对**不存在的分支**不返回非零, 必须检查输出是否为空
          BRANCH_REF=$(git ls-remote --heads "$MANIFEST" "$FOX_BRANCH" 2>/dev/null || true)
          if [ -z "$BRANCH_REF" ]; then
            echo "::error::manifest 分支不存在: $MANIFEST @ $FOX_BRANCH"
            echo "  该仓库可用分支:"
            git ls-remote --heads "$MANIFEST" 2>/dev/null | awk '{print "    "$2}' | head -12
            exit 1
          fi
          echo "  ✓ 分支存在: $BRANCH_REF"

          echo "===> 3/4 repo init (官方同步脚本同款参数)"
          mkdir -p "$SRC_ROOT" && cd "$SRC_ROOT"
          git config --global user.name  "ci-builder"
          git config --global user.email "ci@localhost"
          git config --global http.postBuffer 524288000
          if ! repo init --depth=1 -u "$MANIFEST" -b "$FOX_BRANCH" 2>&1 | tail -25; then
            echo "::error::repo init 失败 (见上方输出)"
            exit 1
          fi

          # ★ 关键: 上游 manifest 把 bootable/recovery 指向 TeamWin 的仓库(android_bootable_recovery,
          # remote=TWRP-A16), 那里没有 OrangeFox 的 orangefox.mk/orangefox_defaults.go。
          # 结果: build/make/envsetup.sh 的 orangefox_envsetup() 判定 NOT_ORANGEFOX=1 并提前 return,
          # 导致 lunch 目标根本不注册, 构建在 3/5 lunch 阶段失败("Not OrangeFox! ...").
          # 用 local_manifest 把 bootable/recovery 改回 OrangeFox 官方仓库即可。
          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/orangefox.xml <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <remote name="fox16" fetch="https://github.com/OrangeFox16" revision="fox_16.0" />
            <remove-project name="android_bootable_recovery" />
            <project path="bootable/recovery" name="android_bootable_recovery"
                     remote="fox16" revision="fox_16.0" />
          </manifest>
          XML
          echo "===> 已写入 local_manifest: bootable/recovery → OrangeFox16/fox_16.0"
          grep -c "bootable/recovery" .repo/local_manifests/orangefox.xml | sed 's/^/      条目数: /'

          # ★ 关键2: 上游 TWRP manifest 的 remove-minimal.xml 删除了 603 个"瘦身"项目,
          # 但本设备(pudding/SM8750)的依赖链需要其中 36 个:
          #   system/media -> libmedia/libstagefright/codecs + libhwui 图形栈
          #   (来源链: vendor.display.config -> 这些库)
          # 缺 system/media 时的报错:
          #   frameworks/av/media/libmedia/include/media/AudioCapabilities.h:24:10:
          #   fatal error: 'system/audio.h' file not found
          #   FAILED: //frameworks/av/media/libmedia:libmedia_codeclist_capabilities
          # 用 tuna(清华 AOSP 镜像)把 36 个项目补回 —— 与本地构建树的
          # .repo/local_manifests/restore-system-media.xml 完全一致。
          cat > .repo/local_manifests/restore-system-media.xml <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <remote name="tuna" fetch="https://mirrors.tuna.tsinghua.edu.cn/git/AOSP" />
            <project path="system/media" name="platform/system/media" remote="tuna" revision="refs/tags/android-16.0.0_r1" groups="pdk" />
            <project path="system/libsysprop" name="platform/system/libsysprop" remote="tuna" revision="refs/tags/android-16.0.0_r1" groups="pdk" />
            <project path="external/speex" name="platform/external/speex" remote="tuna" revision="refs/tags/android-16.0.0_r1" groups="pdk" />
            <project path="external/sonivox" name="platform/external/sonivox" remote="tuna" revision="refs/tags/android-16.0.0_r1" groups="pdk" />
            <project path="external/libjpeg-turbo" name="platform/external/libjpeg-turbo" remote="tuna" revision="refs/tags/android-16.0.0_r1" groups="pdk" />
            <project path="external/libavc" name="platform/external/libavc" remote="tuna" revision="refs/tags/android-16.0.0_r1" groups="pdk" />
            <project path="external/aac" name="platform/external/aac" remote="tuna" revision="refs/tags/android-16.0.0_r1" groups="pdk" />
            <project path="external/libhevc" name="platform/external/libhevc" remote="tuna" revision="refs/tags/android-16.0.0_r1" groups="pdk" />
            <project path="external/vulkan-headers" name="platform/external/vulkan-headers" remote="tuna" revision="refs/tags/android-16.0.0_r1" groups="pdk" />
            <project path="external/libogg" name="platform/external/libogg" remote="tuna" revision="refs/tags/android-16.0.0_r1" groups="pdk" />
            <project path="external/libopus" name="platform/external/libopus" remote="tuna" revision="refs/tags/android-16.0.0_r1" groups="pdk" />
            <project path="external/flac" name="platform/external/flac" remote="tuna" revision="refs/tags/android-16.0.0_r1" groups="pdk" />
            <project path="external/libvpx" name="platform/external/libvpx" remote="tuna" revision="refs/tags/android-16.0.0_r1" groups="pdk" />
            <project path="external/libwebm" name="platform/external/libwebm" remote="tuna" revision="refs/tags/android-16.0.0_r1" groups="pdk" />
            <project path="external/libgsm" name="platform/external/libgsm" remote="tuna" revision="refs/tags/android-16.0.0_r1" groups="pdk" />
            <project path="external/libmpeg2" name="platform/external/libmpeg2" remote="tuna" revision="refs/tags/android-16.0.0_r1" groups="pdk" />
            <project path="external/libaom" name="platform/external/libaom" remote="tuna" revision="refs/tags/android-16.0.0_r1" groups="pdk" />
            <project path="external/image_io" name="platform/external/image_io" remote="tuna" revision="refs/tags/android-16.0.0_r1" groups="pdk" />
            <project path="external/giflib" name="platform/external/giflib" remote="tuna" revision="refs/tags/android-16.0.0_r1" groups="pdk" />
            <project path="external/webp" name="platform/external/webp" remote="tuna" revision="refs/tags/android-16.0.0_r1" groups="pdk" />
            <project path="external/harfbuzz_ng" name="platform/external/harfbuzz_ng" remote="tuna" revision="refs/tags/android-16.0.0_r1" groups="pdk" />
            <project path="frameworks/minikin" name="platform/frameworks/minikin" remote="tuna" revision="refs/tags/android-16.0.0_r1" groups="pdk" />
            <project path="external/pdfium" name="platform/external/pdfium" remote="tuna" revision="refs/tags/android-16.0.0_r1" groups="pdk" />
            <project path="external/rust/crabbyavif" name="platform/external/rust/crabbyavif" remote="tuna" revision="refs/tags/android-16.0.0_r1" groups="pdk" />
            <project path="frameworks/proto_logging" name="platform/frameworks/proto_logging" remote="tuna" revision="refs/tags/android-16.0.0_r1" groups="pdk" />
            <project path="external/flatbuffers" name="platform/external/flatbuffers" remote="tuna" revision="refs/tags/android-16.0.0_r1" groups="pdk" />
            <project path="external/tensorflow" name="platform/external/tensorflow" remote="tuna" revision="refs/tags/android-16.0.0_r1" groups="pdk" />
            <project path="external/FP16" name="platform/external/FP16" remote="tuna" revision="refs/tags/android-16.0.0_r1" groups="pdk" />
            <project path="external/gemmlowp" name="platform/external/gemmlowp" remote="tuna" revision="refs/tags/android-16.0.0_r1" groups="pdk" />
            <project path="external/ruy" name="platform/external/ruy" remote="tuna" revision="refs/tags/android-16.0.0_r1" groups="pdk" />
            <project path="external/fft2d" name="platform/external/fft2d" remote="tuna" revision="refs/tags/android-16.0.0_r1" groups="pdk" />
            <project path="external/libtextclassifier" name="platform/external/libtextclassifier" remote="tuna" revision="refs/tags/android-16.0.0_r1" groups="pdk" />
            <project path="external/eigen" name="platform/external/eigen" remote="tuna" revision="refs/tags/android-16.0.0_r1" groups="pdk" />
            <project path="system/bpf" name="platform/system/bpf" remote="tuna" revision="refs/tags/android-16.0.0_r1" groups="pdk" />
            <project path="system/bpfprogs" name="platform/system/bpfprogs" remote="tuna" revision="refs/tags/android-16.0.0_r1" groups="pdk" />
            <project path="external/bcc" name="platform/external/bcc" remote="tuna" revision="refs/tags/android-16.0.0_r1" groups="pdk" />
          </manifest>
          XML
          echo "===> 已写入 local_manifest: 恢复 36 个被 remove-minimal 移除的项目"
          grep -c "<project" .repo/local_manifests/restore-system-media.xml | sed 's/^/      恢复条目数: /'

          echo "===> 4/4 repo sync"
          if ! repo sync -c -j"$(nproc)" --no-clone-bundle --no-tags 2>&1 | tail -40; then
            echo "::error::repo sync 失败 (见上方输出)"
            exit 1
          fi
          echo "===> 源码树大小:"; du -sh . 2>/dev/null

      - name: 构建
        env:
          # 仓库被 checkout 到 repo/ 子目录, 必须显式告诉脚本仓库根在哪
          REPO_ROOT: ${{ github.workspace }}/repo
          # 不用 runner.cores(=4): AOSP16 在 15.6GB runner 上并行 4 个编译单元会
          # 撑爆内存(本地对照: 构建峰值占用 19GB swap)。2 与本地成功配置一致,
          # 配合 24GB swap 才有把握跑完 soong bootstrap 之后的真正编译。
          BUILD_JOBS: "2"
          CCACHE_DIR: ~/.ccache
          CCACHE_EXEC: /usr/bin/ccache
        run: |
          cd "$SRC_ROOT"
          export USE_CCACHE=1
          ccache -M 8G || true
          bash "$GITHUB_WORKSPACE/repo/scripts/ci-build.sh" "${{ matrix.device.name }}"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: recovery-${{ matrix.device.name }}
          path: repo/artifacts/*
          retention-days: 30
          if-no-files-found: error

      - name: 附加到 Release(tag 触发时)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: repo/artifacts/*
